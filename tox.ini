[tox]
envlist = py37,py38,py39,py310,py311
skip_missing_interpreters = True
isolated_build = True

[testenv]
setenv =
    NO_PROXY=localhost
    no_proxy=localhost

deps =
    .[dev]
install_command = python -m pip install {opts} {packages}
commands =
    python -m pytest --cov-report xml --cov-report html --junit-xml report.xml {posargs}

[testenv:publish]
changedir =
passenv =
  TWINE_*
skip_install=true
deps =
    setuptools_scm
    build
    twine
install_command =
    python -m pip install {opts} {packages}
commands =
    python -m setuptools_scm
    python -m build
    python -m twine check dist/*
    python -m twine upload dist/*
commands_post=
